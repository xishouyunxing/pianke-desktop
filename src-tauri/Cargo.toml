[package]
name = "pianke-desktop"
version = "0.3.0"
description = "片刻桌面版"
authors = ["Pianke"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
opencv-orb = ["pianke-backend/opencv-orb"]

[dependencies]
pianke-backend = { path = "../crates/pianke-backend" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
