[package]
name = "pianke-backend"
version = "0.1.0"
edition = "2021"
description = "Local Rust Fast backend for Pianke"

[dependencies]
axum = "0.7"
ab_glyph = "0.2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
imageproc = "0.25"
exif = { package = "kamadak-exif", version = "0.6" }
ndarray = "0.17"
nalgebra = "0.34"
opencv = { version = "0.98.2", default-features = false, features = ["calib3d", "features2d", "imgproc", "clang-runtime"], optional = true }
ort = "2.0.0-rc.12"
pianke-core = { path = "../pianke-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
once_cell = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
turbojpeg = { version = "1.4.0", features = ["image"], optional = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"

[features]
default = []
opencv-orb = ["dep:opencv", "dep:turbojpeg"]
